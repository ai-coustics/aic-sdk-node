name: CI
env:
  DEBUG: napi:*
  APP_NAME: aic-sdk
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
permissions:
  contents: write
  id-token: write
'on':
  push:
    branches:
      - main
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install dependencies
        run: pnpm install
      - name: Oxlint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:prettier:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --locked
        env:
          RUSTFLAGS: -D warnings
      - name: TOML fmt
        uses: uncenter/setup-taplo@09968a8ae38d66ddd3d23802c44bf6122d7aa991
      - run: taplo fmt --check
      - name: Documentation
        run: cargo doc --locked --document-private-items --all-features --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Unused dependencies
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd
        with:
          tool: cargo-shear
      - run: cargo shear
  build:
    strategy:
      fail-fast: false
      matrix:
        # The native SDK publishes prebuilt libraries for these six targets only, so this
        # list must stay in sync with `napi.targets` in package.json.
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: pnpm build --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build --target aarch64-apple-darwin
          # Both Linux targets build inside the napi-rs Debian images rather than with
          # `--use-napi-cross`. That flag's sysroot is too thin for this dependency tree:
          # `aic-sdk-sys` runs bindgen over a header that includes <stdlib.h>, and `ring`
          # assembles hand-written ARM asm. These images carry a complete sysroot, gcc and
          # clang, and their older glibc keeps the published binaries widely usable.
          #
          # Both images are amd64 — the aarch64 one bundles a cross toolchain — so the
          # host-installed node_modules stay compatible inside the container.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
            build: npm run build -- --target x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian-aarch64
            build: npm run build -- --target aarch64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm build --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm build --target aarch64-pc-windows-msvc
    name: stable - ${{ matrix.settings.target }} - node@22
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      # Installed on the host so the container does not need pnpm; the workspace is mounted
      # into it, so `npm run build` finds the napi CLI in node_modules.
      - name: Install dependencies
        run: pnpm install
      # The build downloads the matching prebuilt native SDK for the target, so these steps
      # need network access.
      # The image ships Rust 1.82, which predates edition 2024 — required by this crate and
      # by `aic-sdk` and `aic-sdk-sys` themselves, so lowering our own edition would not
      # help. The toolchain is updated in the container before building.
      #
      # The workspace is mounted at its own path rather than somewhere like /build, so the
      # absolute paths in pnpm's node_modules symlinks still resolve.
      - name: Build in docker
        if: ${{ matrix.settings.docker }}
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e CARGO_TERM_COLOR \
            -e DEBUG \
            "${{ matrix.settings.docker }}" \
            bash -c 'rustup update stable && rustup default stable && rustup target add ${{ matrix.settings.target }} && ${{ matrix.settings.build }}'
      - name: Build
        run: ${{ matrix.settings.build }}
        if: ${{ !matrix.settings.docker }}
        shell: bash
      # `index.js` and `index.d.ts` are generated by the build but committed, so a change to
      # a Rust signature or doc comment can land without them being regenerated, and the
      # package then ships type declarations that do not describe the addon. One target is
      # enough: both files are generated from `napi.targets` in package.json rather than from
      # the target being built.
      - name: Check the generated bindings are committed
        if: ${{ matrix.settings.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          if ! git diff --exit-code -- index.js index.d.ts; then
            echo '::error::index.js and index.d.ts are stale. Run `pnpm build` and commit the result.'
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: '*.node'
          if-no-files-found: error
  test-macOS-windows-binding:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: macos-latest
            target: x86_64-apple-darwin
            architecture: x64
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
        node:
          - '22'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          architecture: ${{ matrix.settings.architecture }}
      - name: Install dependencies
        run: pnpm install
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      # `pretest` downloads the model fixtures, and the SDK needs a license key to
      # construct a processor, VAD or analyzer.
      - name: Test bindings
        run: pnpm test
        env:
          AIC_SDK_LICENSE: ${{ secrets.AIC_SDK_LICENSE }}
  test-linux-binding:
    name: Test ${{ matrix.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
        node:
          - '22'
    runs-on: ${{ contains(matrix.target, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Output docker params
        id: docker
        run: |
          node -e "
            if ('${{ matrix.target }}'.startsWith('aarch64')) {
              console.log('PLATFORM=linux/arm64')
            } else {
              console.log('PLATFORM=linux/amd64')
            }
          " >> $GITHUB_OUTPUT
          echo "IMAGE=node:${{ matrix.node }}-slim" >> $GITHUB_OUTPUT
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Install dependencies
        run: pnpm install --force
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.target }}
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        uses: tj-actions/docker-run@v2
        env:
          AIC_SDK_LICENSE: ${{ secrets.AIC_SDK_LICENSE }}
        with:
          image: ${{ steps.docker.outputs.IMAGE }}
          name: test-binding
          options: '-v ${{ steps.docker.outputs.PNPM_STORE_PATH }}:${{ steps.docker.outputs.PNPM_STORE_PATH }} -v ${{ github.workspace }}:${{ github.workspace }} -w ${{ github.workspace }} --platform ${{ steps.docker.outputs.PLATFORM }} -e AIC_SDK_LICENSE'
          args: npm run test
  # Runs every example end to end. The lint job typechecks them against `index.d.ts`, which
  # catches a renamed method, but only running them catches a retired model id, a change in
  # SDK behaviour, or an example whose own logic has gone wrong.
  run-examples:
    name: Run examples - node@22
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .
      # Pull requests from forks cannot read secrets, and the examples cannot construct
      # anything without a license key. Rather than fail those runs, the steps below are
      # skipped and the job reports why.
      - name: Check for a license key
        id: license
        env:
          AIC_SDK_LICENSE: ${{ secrets.AIC_SDK_LICENSE }}
        run: |
          if [ -n "$AIC_SDK_LICENSE" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::AIC_SDK_LICENSE is unavailable, so the examples were not run. This is expected for pull requests from forks.'
          fi
      # `file-processing.js` needs real audio. A second of a 220 Hz tone is enough to
      # exercise the read, block loop, delay compensation and write.
      - name: Synthesize an input file
        if: steps.license.outputs.available == 'true'
        run: |
          node - <<'EOF'
          const fs = require('node:fs')
          const { WaveFile } = require('wavefile')

          const sampleRate = 16000
          const samples = Float32Array.from(
            { length: sampleRate },
            (_, i) => Math.sin((2 * Math.PI * 220 * i) / sampleRate) * 0.3,
          )

          const wav = new WaveFile()
          wav.fromScratch(1, sampleRate, '32f', samples)
          fs.writeFileSync('example-input.wav', wav.toBuffer())
          EOF
      # One example per line so a failure names itself. The models are downloaded into
      # ./models on first use and reused by the later examples, so this costs three
      # downloads rather than six.
      - name: Run examples
        if: steps.license.outputs.available == 'true'
        env:
          AIC_SDK_LICENSE: ${{ secrets.AIC_SDK_LICENSE }}
        run: |
          set -euxo pipefail
          node examples/enhancement.js
          node examples/enhancement-async.js
          node examples/vad.js
          node examples/vad-async.js
          node examples/analysis.js
          node examples/file-processing.js --input example-input.wav
      # The example writes alongside its input, so a missing file means the run silently
      # produced nothing.
      - name: Check the enhanced file was written
        if: steps.license.outputs.available == 'true'
        run: test -s example-input_enhanced.wav
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - lint
      - test-macOS-windows-binding
      - test-linux-binding
      - run-examples
    steps:
      - uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: create npm dirs
        run: pnpm napi create-npm-dirs
      - name: Move artifacts
        run: pnpm artifacts
      - name: List packages
        run: ls -R ./npm
        shell: bash
      - name: Publish
        run: |
          npm config set provenance true
          if git log -1 --pretty=%B | grep "^v\?[0-9]\+\.[0-9]\+\.[0-9]\+$";
          then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
            npm publish --access public
          elif git log -1 --pretty=%B | grep "^v\?[0-9]\+\.[0-9]\+\.[0-9]\+";
          then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
            npm publish --tag next --access public
          else
            echo "Not a release, skipping publish"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
