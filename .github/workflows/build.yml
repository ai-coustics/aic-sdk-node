name: Build and Publish

on:
  push:
    tags:
      - "*.*.*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
          # Linux ARM64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
          # macOS x64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x64
          # macOS ARM64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: win32-arm64-msvc

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.platform == 'linux-arm64-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "[target.aarch64-unknown-linux-gnu]" >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Install dependencies
        run: npm install

      # Builds and places the binary in one step. The script asks cargo for the artifact path
      # instead of reconstructing the per-platform file name, so `npm run build` can share it.
      - name: Build native module
        shell: bash
        run: bash scripts/build-target.sh npm/${{ matrix.platform }}/index.node ${{ matrix.target }}

      - name: Upload platform binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: npm/${{ matrix.platform }}/index.node
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/')"

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Download Linux x64 binary
        uses: actions/download-artifact@v8
        with:
          name: linux-x64-gnu
          path: .

      - name: Install dependencies
        run: npm install

      - name: Run tests and examples
        run: |
          npm test
          node examples/enhancement.js
          node examples/vad.js
          node examples/file-processing.js --input ./tests/data/test_signal.wav --output ./tmp.wav
        env:
          AIC_SDK_LICENSE: ${{ secrets.AIC_SDK_LICENSE }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only publish when pushing a version tag
    if: startsWith(github.ref, 'refs/tags/')

    # Required for OIDC trusted publishing
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Ensure tagged releases only happen from main branch
      - name: Verify tag is on main branch
        run: |
          if ! git branch -r --contains ${{ github.ref }} | grep -q 'origin/main'; then
            echo "Error: Tag ${{ github.ref }} is not on the main branch"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install latest npm for OIDC support
        run: npm install -g npm@latest

      # Download each binary by name directly into its platform package.
      # A named download does a direct lookup (not a list-all), so it fails
      # loudly if an artifact is missing instead of silently downloading a
      # partial set, which is how a previous release half-published.
      - name: Download linux-x64-gnu binary
        uses: actions/download-artifact@v8
        with:
          name: linux-x64-gnu
          path: npm/linux-x64-gnu

      - name: Download linux-arm64-gnu binary
        uses: actions/download-artifact@v8
        with:
          name: linux-arm64-gnu
          path: npm/linux-arm64-gnu

      - name: Download darwin-x64 binary
        uses: actions/download-artifact@v8
        with:
          name: darwin-x64
          path: npm/darwin-x64

      - name: Download darwin-arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: darwin-arm64
          path: npm/darwin-arm64

      - name: Download win32-x64-msvc binary
        uses: actions/download-artifact@v8
        with:
          name: win32-x64-msvc
          path: npm/win32-x64-msvc

      - name: Download win32-arm64-msvc binary
        uses: actions/download-artifact@v8
        with:
          name: win32-arm64-msvc
          path: npm/win32-arm64-msvc

      - name: Verify all platform binaries are present
        run: |
          missing=0
          for platform in linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64 win32-x64-msvc win32-arm64-msvc; do
            if [[ ! -f "npm/$platform/index.node" ]]; then
              echo "Error: npm/$platform/index.node is missing"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "One or more platform binaries are missing; aborting before publish."
            exit 1
          fi

      - name: Publish platform packages
        run: |
          for platform in linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64 win32-x64-msvc win32-arm64-msvc; do
            cd npm/$platform
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version, already published"
            else
              npm publish --access public --ignore-scripts
            fi
            cd ../..
          done

      - name: Publish main package
        run: |
          npm pkg delete scripts.prepublishOnly
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "Skipping $name@$version, already published"
          else
            npm publish --access public
          fi

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: release/release-notes.md
