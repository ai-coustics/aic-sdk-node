
[package]
edition = "2024"
name = "aic_sdk_node"
version = "0.24.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# `download-lib` fetches the matching prebuilt native library for $TARGET during the
# build, so each `napi build --target <triple>` produces a self-contained `.node`
# with no runtime library discovery. `download-model` backs `Model.download`.
aic-sdk = { version = "0.23", features = ["download-lib", "download-model"] }
napi = { version = "3.0.0", default-features = false, features = ["napi4"] }
napi-derive = "3.0.0"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
